schema: cooksprite.actions/v1
actions:
  - id: image.generate
    i18n:
      zh-CN: {name: 创作图片, description: 从文字或最多四张参考图创作静态素材}
      en: {name: Create image, description: Create a static asset from text or up to four reference images}
    accepts:
      reference: {type: Image, required: false, max: 4}
    produces: [Image]
    controls:
      - id: category
        type: select
        default: character
        i18n:
          zh-CN: {name: 素材类型, description: ""}
          en: {name: Asset type, description: ""}
        options:
          - {id: character, example_key: still.actor, i18n: {zh-CN: {name: 角色, description: 单个完整角色，全身和轮廓清楚}, en: {name: Character, description: One complete character with a clear full-body silhouette}}}
          - {id: weapon, example_key: still.object, i18n: {zh-CN: {name: 武器, description: 单件完整武器，主体不被裁切}, en: {name: Weapon, description: One complete weapon, fully visible and uncropped}}}
          - {id: prop, example_key: still.object, i18n: {zh-CN: {name: 道具 / 场景元素, description: 单个完整的道具或环境元素}, en: {name: Prop / scene element, description: One complete prop or environment element}}}
          - {id: terrain, example_key: still.tile, i18n: {zh-CN: {name: 地形块, description: 正交视角、可无缝平铺的地图块}, en: {name: Terrain tile, description: Orthographic, seamlessly tileable map material}}}
          - {id: vfx, example_key: still.effect, i18n: {zh-CN: {name: 特效, description: 居中的独立视觉特效}, en: {name: VFX, description: One centered, isolated visual effect}}}
      - id: style
        type: select
        default: 2d_action_game
        i18n:
          zh-CN: {name: 风格, description: ""}
          en: {name: Style, description: ""}
        options:
          - {id: ultra_realistic, categories: [character], example_key: still.smooth, i18n: {zh-CN: {name: 超写实, description: 高分辨率超写实角色渲染}, en: {name: Ultra-realistic, description: Ultra-realistic high-resolution character render}}}
          - {id: 2d_action_game, categories: [character], example_key: still.actor, i18n: {zh-CN: {name: 2D 动作游戏, description: 高分辨率 2D 动作游戏角色插画}, en: {name: 2D action game, description: Polished high-resolution 2D action-game character illustration}}}
          - {id: stylized_3d, categories: [character], example_key: still.smooth, i18n: {zh-CN: {name: 风格化 3D, description: 高分辨率风格化 3D 角色渲染}, en: {name: Stylized 3D, description: Polished high-resolution stylized 3D character render}}}
          - {id: anime, categories: [character], example_key: still.actor, i18n: {zh-CN: {name: 动漫, description: 带赛璐璐着色的高分辨率动漫角色插画}, en: {name: Anime, description: Polished high-resolution anime character illustration with cel shading}}}
          - {id: pixel_art, categories: [character], example_key: still.actor, i18n: {zh-CN: {name: 像素艺术, description: 有意组织像素簇和有限配色的清晰像素角色}, en: {name: Pixel art, description: Crisp pixel-art character sprite with deliberate pixel clusters and a limited color palette}}}
          - {id: weapon_realistic_tactical, categories: [weapon], example_key: still.object, i18n: {zh-CN: {name: 写实战术, description: 材料可信、结构可用的战术武器}, en: {name: Realistic tactical, description: Tactical weapon with plausible materials and functional construction}}}
          - {id: weapon_scifi_hardsurface, categories: [weapon], example_key: still.object, i18n: {zh-CN: {name: 科幻硬表面, description: 模块化机械结构和克制发光细节}, en: {name: Sci-fi hard surface, description: Modular mechanical construction with controlled emissive details}}}
          - {id: weapon_hand_painted_fantasy, categories: [weapon], example_key: still.object, i18n: {zh-CN: {name: 手绘奇幻, description: 锻造材质、工艺装饰和英雄比例}, en: {name: Hand-painted fantasy, description: Forged materials, crafted ornament and heroic proportions}}}
          - {id: weapon_stylized_3d, categories: [weapon], example_key: still.object, i18n: {zh-CN: {name: 风格化 3D, description: 强轮廓、简化材质面和清晰配色}, en: {name: Stylized 3D, description: Bold proportions, simplified material planes and clean color grouping}}}
          - {id: weapon_pixel_art, categories: [weapon], example_key: still.object, i18n: {zh-CN: {name: 像素武器, description: 有意组织像素簇、有限配色和清晰轮廓}, en: {name: Pixel-art weapon, description: Deliberate pixel clusters, limited palette and readable silhouette}}}
          - {id: prop_realistic_game_ready, categories: [prop], example_key: still.object, i18n: {zh-CN: {name: 写实游戏道具, description: 可信材质、磨损和实用结构}, en: {name: Realistic game prop, description: Physically based materials, believable wear and practical construction}}}
          - {id: prop_hand_painted_rpg, categories: [prop], example_key: still.object, i18n: {zh-CN: {name: 手绘 RPG, description: 表现性材质、工艺细节和可控笔触}, en: {name: Hand-painted RPG, description: Expressive materials, crafted details and controlled painterly shading}}}
          - {id: prop_storybook, categories: [prop], example_key: still.object, i18n: {zh-CN: {name: 温暖绘本, description: 手工形状、柔和配色和亲切装饰}, en: {name: Warm storybook, description: Handcrafted shapes, soft color harmony and charming details}}}
          - {id: prop_stylized_3d, categories: [prop], example_key: still.object, i18n: {zh-CN: {name: 风格化 3D, description: 简化几何、宽材质面和清晰功能结构}, en: {name: Stylized 3D, description: Simplified geometry, broad material planes and readable function}}}
          - {id: prop_pixel_art, categories: [prop], example_key: still.object, i18n: {zh-CN: {name: 像素道具, description: 紧凑像素簇、有限配色和清晰图标轮廓}, en: {name: Pixel-art prop, description: Compact pixel clusters, limited palette and clear icon silhouette}}}
          - {id: terrain_realistic_pbr, categories: [terrain], example_key: still.tile, i18n: {zh-CN: {name: 写实 PBR, description: 可信材质响应和自然微变化}, en: {name: Realistic PBR, description: Physically plausible material response and fine natural variation}}}
          - {id: terrain_hand_painted_rpg, categories: [terrain], example_key: still.tile, i18n: {zh-CN: {name: 手绘 RPG, description: 表现性笔触、简化材质簇和清晰色差}, en: {name: Hand-painted RPG, description: Expressive brushwork, simplified material clusters and readable variation}}}
          - {id: terrain_stylized_low_poly, categories: [terrain], example_key: still.tile, i18n: {zh-CN: {name: 风格化低模, description: 宽材质面、简化细节和清晰色块}, en: {name: Stylized low-poly, description: Broad material planes, simplified detail and clean color blocks}}}
          - {id: terrain_pixel_art, categories: [terrain], example_key: still.tile, i18n: {zh-CN: {name: 像素地形, description: 有意组织像素簇、受控噪声和有限配色}, en: {name: Pixel-art terrain, description: Deliberate pixel clusters, controlled noise and limited palette}}}
          - {id: terrain_cartoon, categories: [terrain], example_key: still.tile, i18n: {zh-CN: {name: 卡通地形, description: 粗形状、紧凑材质细节和清晰配色}, en: {name: Cartoon terrain, description: Bold shapes, compact material detail and clear color grouping}}}
          - {id: vfx_stylized_action, categories: [vfx], example_key: still.effect, i18n: {zh-CN: {name: 风格化动作, description: 粗图形、强冲击方向和玩法可读性}, en: {name: Stylized action, description: Bold graphic shapes, strong impact direction and gameplay readability}}}
          - {id: vfx_painterly_fantasy, categories: [vfx], example_key: still.effect, i18n: {zh-CN: {name: 手绘奇幻魔法, description: 分层发光形态、流动粒子和装饰能量}, en: {name: Painterly fantasy magic, description: Layered luminous forms, flowing particles and ornamental energy}}}
          - {id: vfx_anime_combat, categories: [vfx], example_key: still.effect, i18n: {zh-CN: {name: 动漫战斗, description: 锐利能量弧、赛璐璐辉光和速度线}, en: {name: Anime combat, description: Sharp energy arcs, cel-shaded glow and speed accents}}}
          - {id: vfx_realistic_cinematic, categories: [vfx], example_key: still.effect, i18n: {zh-CN: {name: 写实电影特效, description: 可信能量、体积细节和受控辉光}, en: {name: Realistic cinematic, description: Plausible energy, volumetric detail and controlled glow}}}
          - {id: vfx_pixel_art, categories: [vfx], example_key: still.effect, i18n: {zh-CN: {name: 像素特效, description: 硬边像素簇、有限辉光层级和清晰关键帧}, en: {name: Pixel-art VFX, description: Hard-edged pixel clusters, limited glow levels and clear keyframe}}}
          - {id: pixel, categories: [legacy], example_key: still.actor, i18n: {zh-CN: {name: 像素（兼容）, description: 旧客户端兼容值}, en: {name: Pixel (legacy), description: Compatibility value for older clients}}}
          - {id: smooth, categories: [legacy], example_key: still.smooth, i18n: {zh-CN: {name: 非像素（兼容）, description: 旧客户端兼容值}, en: {name: Smooth (legacy), description: Compatibility value for older clients}}}
      - id: prompt
        type: text
        default: ""
        i18n:
          zh-CN: {name: 描述, description: 写下你想创作的内容}
          en: {name: Prompt, description: Describe what you want to create}
      - id: prompt_compile
        type: toggle
        default: true
        i18n:
          zh-CN: {name: 提示词模板, description: 开启后使用 CookSprite 提示词模板；关闭后原文直传}
          en: {name: Prompt Template, description: Use the CookSprite prompt template; off sends your exact text unchanged}
      - id: resolution
        type: select
        default: "512"
        i18n:
          zh-CN: {name: 分辨率, description: 生成 1:1 图片，选择边长}
          en: {name: Resolution, description: Generate a 1:1 image at this edge size}
        options:
          - {id: "64", i18n: {zh-CN: {name: "64"}, en: {name: "64"}}}
          - {id: "128", i18n: {zh-CN: {name: "128"}, en: {name: "128"}}}
          - {id: "256", i18n: {zh-CN: {name: "256"}, en: {name: "256"}}}
          - {id: "512", i18n: {zh-CN: {name: "512"}, en: {name: "512"}}}
          - {id: "1024", i18n: {zh-CN: {name: "1024"}, en: {name: "1024"}}}
      - id: strength
        type: range
        default: 0.65
        min: 0
        max: 1
        step: 0.05
        advanced: true
        i18n:
          zh-CN: {name: 重绘强度, description: 仅在有参考图时使用}
          en: {name: Redraw strength, description: Used only with a reference image}
      - id: count
        type: select
        default: "4"
        i18n:
          zh-CN: {name: 候选数, description: 一次生成的候选数量}
          en: {name: Candidates, description: Number of candidates per run}
        options:
          - {id: "1", i18n: {zh-CN: {name: "1"}, en: {name: "1"}}}
          - {id: "2", i18n: {zh-CN: {name: "2"}, en: {name: "2"}}}
          - {id: "3", i18n: {zh-CN: {name: "3"}, en: {name: "3"}}}
          - {id: "4", i18n: {zh-CN: {name: "4"}, en: {name: "4"}}}
      - id: seed
        type: seed
        default: -1
        advanced: true
        i18n:
          zh-CN: {name: 随机种子, description: -1 表示随机}
          en: {name: Seed, description: -1 means random}
  - id: animation.generate
    i18n:
      zh-CN: {name: 创作动画, description: 使用当前模型支持的文字或角色图生成动作候选帧}
      en: {name: Create animation, description: Generate motion candidates from text or a character image when supported by the selected model}
    accepts:
      character: {type: Image, required: false, max: 1}
    produces: [FrameSeq]
    controls:
      - id: prompt
        type: text
        default: ""
        i18n:
          zh-CN: {name: 动画描述, description: 可补充动作、节奏和角色要求}
          en: {name: Motion prompt, description: Optional motion, timing, and character details}
      - id: prompt_compile
        type: toggle
        default: true
        i18n:
          zh-CN: {name: 提示词模板, description: 开启后使用 CookSprite 提示词模板；关闭后原文直传}
          en: {name: Prompt Template, description: Use the CookSprite prompt template; off sends your exact text unchanged}
      - id: action
        type: select
        default: walk
        i18n:
          zh-CN: {name: 动作, description: 选择要创作的动作}
          en: {name: Action, description: Choose a motion}
        options:
          - {id: idle, example_key: motion.idle, i18n: {zh-CN: {name: 待机}, en: {name: Idle}}}
          - {id: walk, example_key: motion.walk, i18n: {zh-CN: {name: 行走}, en: {name: Walk}}}
          - {id: run, example_key: motion.run, i18n: {zh-CN: {name: 奔跑}, en: {name: Run}}}
          - {id: attack, example_key: motion.attack, i18n: {zh-CN: {name: 攻击}, en: {name: Attack}}}
          - {id: cast, example_key: motion.cast, i18n: {zh-CN: {name: 施法}, en: {name: Cast}}}
          - {id: hit, example_key: motion.hit, i18n: {zh-CN: {name: 受击}, en: {name: Hit}}}
          - {id: jump, example_key: motion.jump, i18n: {zh-CN: {name: 跳跃}, en: {name: Jump}}}
          - {id: death, example_key: motion.death, i18n: {zh-CN: {name: 倒下}, en: {name: Death}}}
      - id: view
        type: select
        default: level
        i18n:
          zh-CN: {name: 视角, description: 本次动画只对应一个视角}
          en: {name: View, description: This sequence targets one view}
        options:
          - {id: level, i18n: {zh-CN: {name: 平视正交}, en: {name: Level orthographic}}}
          - {id: top45, i18n: {zh-CN: {name: 45° 俯视}, en: {name: Top-45 orthographic}}}
      - id: direction
        type: select
        default: s
        i18n:
          zh-CN: {name: 方向, description: 本次动画只对应一个真实方向}
          en: {name: Direction, description: This sequence targets one real direction}
        options:
          - {id: n, i18n: {zh-CN: {name: 北}, en: {name: North}}}
          - {id: ne, i18n: {zh-CN: {name: 东北}, en: {name: North-east}}}
          - {id: e, i18n: {zh-CN: {name: 东}, en: {name: East}}}
          - {id: se, i18n: {zh-CN: {name: 东南}, en: {name: South-east}}}
          - {id: s, i18n: {zh-CN: {name: 南}, en: {name: South}}}
          - {id: sw, i18n: {zh-CN: {name: 西南}, en: {name: South-west}}}
          - {id: w, i18n: {zh-CN: {name: 西}, en: {name: West}}}
          - {id: nw, i18n: {zh-CN: {name: 西北}, en: {name: North-west}}}
      - id: count
        type: number
        default: 8
        min: 1
        max: 16
        step: 1
        i18n:
          zh-CN: {name: 每轨候选帧, description: 生成后可人工挑选}
          en: {name: Frames per track, description: Candidates to curate after generation}
      - id: seed
        type: seed
        default: -1
        advanced: true
        i18n:
          zh-CN: {name: 随机种子, description: -1 表示随机}
          en: {name: Seed, description: -1 means random}
  - id: frame.redraw
    i18n:
      zh-CN: {name: 重绘帧, description: 保留原帧并生成可替换变体}
      en: {name: Redraw frame, description: Keep the source and create replacement variants}
    accepts:
      frame: {type: Image, required: true, max: 1}
    produces: [ImageBatch]
    controls:
      - id: prompt
        type: text
        default: ""
        i18n: {zh-CN: {name: 修改要求}, en: {name: Change request}}
      - id: strength
        type: range
        default: 0.35
        min: 0
        max: 1
        step: 0.05
        i18n: {zh-CN: {name: 重绘强度}, en: {name: Redraw strength}}
      - id: count
        type: number
        default: 4
        min: 1
        max: 8
        step: 1
        i18n: {zh-CN: {name: 变体数}, en: {name: Variants}}

  - id: sheet.slice
    i18n:
      zh-CN: {name: 切分图集, description: 按网格把 SpriteSheet 变成候选帧}
      en: {name: Slice sheet, description: Turn a SpriteSheet grid into frame candidates}
    accepts:
      sheet: {type: SpriteSheet, required: true, max: 1}
    produces: [FrameSeq]
    controls:
      - {id: action, type: select, default: walk, i18n: {zh-CN: {name: 目标动作}, en: {name: Target action}}, options: [{id: idle, i18n: {zh-CN: {name: 待机}, en: {name: Idle}}}, {id: walk, i18n: {zh-CN: {name: 行走}, en: {name: Walk}}}, {id: run, i18n: {zh-CN: {name: 奔跑}, en: {name: Run}}}, {id: attack, i18n: {zh-CN: {name: 攻击}, en: {name: Attack}}}, {id: cast, i18n: {zh-CN: {name: 施法}, en: {name: Cast}}}, {id: hit, i18n: {zh-CN: {name: 受击}, en: {name: Hit}}}, {id: jump, i18n: {zh-CN: {name: 跳跃}, en: {name: Jump}}}, {id: death, i18n: {zh-CN: {name: 倒下}, en: {name: Death}}}]}
      - {id: view, type: select, default: level, i18n: {zh-CN: {name: 目标视角}, en: {name: Target view}}, options: [{id: level, i18n: {zh-CN: {name: 平视正交}, en: {name: Level orthographic}}}, {id: top45, i18n: {zh-CN: {name: 45° 俯视}, en: {name: Top-45 orthographic}}}]}
      - {id: direction, type: select, default: s, i18n: {zh-CN: {name: 目标方向}, en: {name: Target direction}}, options: [{id: n, i18n: {zh-CN: {name: 北}, en: {name: North}}}, {id: ne, i18n: {zh-CN: {name: 东北}, en: {name: North-east}}}, {id: e, i18n: {zh-CN: {name: 东}, en: {name: East}}}, {id: se, i18n: {zh-CN: {name: 东南}, en: {name: South-east}}}, {id: s, i18n: {zh-CN: {name: 南}, en: {name: South}}}, {id: sw, i18n: {zh-CN: {name: 西南}, en: {name: South-west}}}, {id: w, i18n: {zh-CN: {name: 西}, en: {name: West}}}, {id: nw, i18n: {zh-CN: {name: 西北}, en: {name: North-west}}}]}
      - {id: columns, type: number, default: 0, min: 0, max: 256, step: 1, i18n: {zh-CN: {name: 列数（0 自动）}, en: {name: Columns (0 auto)}}}
      - {id: rows, type: number, default: 0, min: 0, max: 256, step: 1, i18n: {zh-CN: {name: 行数（0 自动）}, en: {name: Rows (0 auto)}}}
      - {id: frame_width, type: number, default: 64, min: 1, max: 4096, step: 1, i18n: {zh-CN: {name: 帧宽}, en: {name: Frame width}}}
      - {id: frame_height, type: number, default: 64, min: 1, max: 4096, step: 1, i18n: {zh-CN: {name: 帧高}, en: {name: Frame height}}}
      - {id: margin, type: number, default: 0, min: 0, max: 512, step: 1, advanced: true, i18n: {zh-CN: {name: 外边距}, en: {name: Margin}}}
      - {id: spacing, type: number, default: 0, min: 0, max: 512, step: 1, advanced: true, i18n: {zh-CN: {name: 间距}, en: {name: Spacing}}}
      - {id: exclude_empty, type: toggle, default: true, advanced: true, i18n: {zh-CN: {name: 排除空帧}, en: {name: Exclude empty}}}

  - id: video.sample
    i18n:
      zh-CN: {name: 视频取帧, description: 从 GIF 或视频采样候选帧}
      en: {name: Sample video, description: Sample frame candidates from GIF or video}
    accepts:
      video: {type: Video, required: true, max: 1}
    produces: [FrameSeq]
    controls:
      - {id: action, type: select, default: walk, i18n: {zh-CN: {name: 目标动作}, en: {name: Target action}}, options: [{id: idle, i18n: {zh-CN: {name: 待机}, en: {name: Idle}}}, {id: walk, i18n: {zh-CN: {name: 行走}, en: {name: Walk}}}, {id: run, i18n: {zh-CN: {name: 奔跑}, en: {name: Run}}}, {id: attack, i18n: {zh-CN: {name: 攻击}, en: {name: Attack}}}, {id: cast, i18n: {zh-CN: {name: 施法}, en: {name: Cast}}}, {id: hit, i18n: {zh-CN: {name: 受击}, en: {name: Hit}}}, {id: jump, i18n: {zh-CN: {name: 跳跃}, en: {name: Jump}}}, {id: death, i18n: {zh-CN: {name: 倒下}, en: {name: Death}}}]}
      - {id: view, type: select, default: level, i18n: {zh-CN: {name: 目标视角}, en: {name: Target view}}, options: [{id: level, i18n: {zh-CN: {name: 平视正交}, en: {name: Level orthographic}}}, {id: top45, i18n: {zh-CN: {name: 45° 俯视}, en: {name: Top-45 orthographic}}}]}
      - {id: direction, type: select, default: s, i18n: {zh-CN: {name: 目标方向}, en: {name: Target direction}}, options: [{id: n, i18n: {zh-CN: {name: 北}, en: {name: North}}}, {id: ne, i18n: {zh-CN: {name: 东北}, en: {name: North-east}}}, {id: e, i18n: {zh-CN: {name: 东}, en: {name: East}}}, {id: se, i18n: {zh-CN: {name: 东南}, en: {name: South-east}}}, {id: s, i18n: {zh-CN: {name: 南}, en: {name: South}}}, {id: sw, i18n: {zh-CN: {name: 西南}, en: {name: South-west}}}, {id: w, i18n: {zh-CN: {name: 西}, en: {name: West}}}, {id: nw, i18n: {zh-CN: {name: 西北}, en: {name: North-west}}}]}
      - {id: sample_fps, type: range, default: 12, min: 1, max: 60, step: 1, i18n: {zh-CN: {name: 采样帧率}, en: {name: Sample FPS}}}
      - {id: max_frames, type: number, default: 48, min: 1, max: 240, step: 1, advanced: true, i18n: {zh-CN: {name: 最大帧数}, en: {name: Maximum frames}}}

  - id: normal.generate
    i18n:
      zh-CN: {name: 生成法线, description: 为图片或当前动画轨道生成同尺寸法线}
      en: {name: Generate normals, description: Generate same-size normals for an image or animation track}
    accepts:
      source: {type: [Image, FrameSeq, SpriteSheet], required: true, max: 1}
      pixel_plan: {type: PixelGeometryPlan, required: false, max: 1}
    produces: [NormalMap]
    controls:
      - {id: strength, type: range, default: 1, min: 0, max: 2, step: 0.05, i18n: {zh-CN: {name: 法线强度}, en: {name: Normal strength}}}
      - {id: flip_y, type: toggle, default: false, i18n: {zh-CN: {name: 翻转 Y}, en: {name: Flip Y}}}
      - {id: frame_index, type: number, default: -1, min: -1, max: 239, step: 1, advanced: true, i18n: {zh-CN: {name: 选中序列帧}, en: {name: Selected sequence frame}}}

  - id: sprite.pixelize
    i18n:
      zh-CN: {name: 生成像素法线 Sprite, description: 估计法线并联合像素化漫反射图与法线图}
      en: {name: Build pixel-normal sprite, description: Estimate normals and jointly pixelize diffuse and normal maps}
    accepts:
      source: {type: [Image, FrameSeq, SpriteSheet], required: true, max: 1}
    produces: [Image, FrameSeq, NormalMap]
    controls:
      - {id: strength, type: range, default: 1, min: 0, max: 2, step: 0.05, i18n: {zh-CN: {name: 法线强度}, en: {name: Normal strength}}}
      - {id: flip_y, type: toggle, default: false, i18n: {zh-CN: {name: 翻转 Y}, en: {name: Flip Y}}}
      - id: target_size
        type: select
        default: "128"
        options_range: [16, 512, 16]
        i18n:
          zh-CN: {name: 像素尺寸, description: 输出最长边，自动保持原图长宽比}
          en: {name: Pixel size, description: Output longest edge while preserving aspect ratio}
      - id: palette_budget
        type: select
        default: "32"
        i18n:
          zh-CN: {name: 调色板, description: Oklab 调色板颜色数量}
          en: {name: Palette, description: Number of colors in the Oklab palette}
        options:
          - {id: "8", i18n: {zh-CN: {name: 8 色}, en: {name: 8 colors}}}
          - {id: "16", i18n: {zh-CN: {name: 16 色}, en: {name: 16 colors}}}
          - {id: "32", i18n: {zh-CN: {name: 32 色}, en: {name: 32 colors}}}
          - {id: "64", i18n: {zh-CN: {name: 64 色}, en: {name: 64 colors}}}
          - {id: "128", i18n: {zh-CN: {name: 128 色}, en: {name: 128 colors}}}
      - id: outline
        type: toggle
        default: false
        i18n:
          zh-CN: {name: 描边, description: 开启后使用所选颜色描边}
          en: {name: Outline, description: Draw an outline with the selected color}
      - id: outline_color
        type: color
        default: "#000000"
        i18n:
          zh-CN: {name: 描边颜色, description: 描边开启时使用的颜色}
          en: {name: Outline color, description: Color used when outline is enabled}

  - id: image.views
    i18n:
      zh-CN: {name: 创建视角组, description: 从一张参考图创建一组视角图片}
      en: {name: Create image views, description: Create a batch of views from one reference image}
    accepts:
      source: {type: Image, required: true, max: 1}
    produces: [ImageBatch]
    controls: []

  - id: image.pixelize
    i18n:
      zh-CN: {name: 像素化图片, description: 把高分辨率图片转换为像素化图片}
      en: {name: Pixelize image, description: Convert a high-resolution image into pixel art}
    accepts:
      source: {type: [Image, FrameSeq], required: true, max: 1}
    produces: [Image, FrameSeq]
    controls:
      - id: target_size
        type: select
        default: "128"
        options_range: [16, 512, 16]
        i18n:
          zh-CN: {name: 像素尺寸, description: 输出最长边，自动保持原图长宽比}
          en: {name: Pixel size, description: Output longest edge while preserving aspect ratio}
      - id: palette_budget
        type: select
        default: "32"
        i18n:
          zh-CN: {name: 调色板, description: Oklab 调色板颜色数量}
          en: {name: Palette, description: Number of colors in the Oklab palette}
        options:
          - {id: "8", i18n: {zh-CN: {name: 8 色}, en: {name: 8 colors}}}
          - {id: "16", i18n: {zh-CN: {name: 16 色}, en: {name: 16 colors}}}
          - {id: "32", i18n: {zh-CN: {name: 32 色}, en: {name: 32 colors}}}
          - {id: "64", i18n: {zh-CN: {name: 64 色}, en: {name: 64 colors}}}
          - {id: "128", i18n: {zh-CN: {name: 128 色}, en: {name: 128 colors}}}
      - id: outline
        type: toggle
        default: false
        i18n:
          zh-CN: {name: 描边, description: 开启后使用黑边算法；关闭后保留更多眼睛和高光细节}
          en: {name: Outline, description: Use the outline algorithm; turn off to preserve more small highlights}
      - id: outline_color
        type: color
        default: "#000000"
        i18n:
          zh-CN: {name: 描边颜色, description: 描边开启时使用的颜色}
          en: {name: Outline color, description: Color used when outline is enabled}
      - id: temporal_mode
        type: select
        default: auto
        i18n:
          zh-CN: {name: 时序处理, description: 仅多帧序列可用；自动模式只对连续视频启用光流}
          en: {name: Temporal mode, description: Only used for frame sequences; auto enables flow only for continuous sampled video}
        options:
          - {id: auto, i18n: {zh-CN: {name: 自动, description: 连续视频使用光流，其他序列共享风格}, en: {name: Auto, description: Flow for sampled video; shared style otherwise}}}
          - {id: shared, i18n: {zh-CN: {name: 共享风格, description: 共享几何和调色板，不使用光流}, en: {name: Shared style, description: Shared geometry and palette without flow}}}
          - {id: flow, i18n: {zh-CN: {name: 连续视频（光流）, description: 仅适用于每秒至少 8 帧的连续视频取帧}, en: {name: Continuous video (flow), description: Only for sampled continuous video at 8 FPS or above}}}
          - {id: independent, i18n: {zh-CN: {name: 逐帧, description: 每帧独立像素化}, en: {name: Independent, description: Pixelize every frame independently}}}

  - id: image.cutout
    i18n:
      zh-CN: {name: 抠图, description: 从图片中提取带透明通道的主体}
      en: {name: Cut out image, description: Extract the subject as an RGBA image}
    accepts:
      source: {type: Image, required: true, max: 1}
    produces: [Image]
    controls: []
