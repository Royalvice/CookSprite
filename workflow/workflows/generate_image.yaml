# generate_image — inference-only workflow: one prompt -> one raw image.
#
# Task-independent and reusable: any task that needs a generated base image
# mounts this. Reference example for a minimal single-tool workflow.
id: generate_image
description: Generate one raw image from a text prompt.

params:
  prompt:   { type: string, default: "" }
  model_id: { type: string, default: "stub-image" }
  seed:     { type: int,    default: 0 }

nodes:
  - id: gen
    tool: text2img
    params:
      prompt: ${prompt}
      model_id: ${model_id}
      width: 512
      height: 512
      seed: ${seed}

output: gen.image
