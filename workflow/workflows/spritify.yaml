# spritify — deterministic workflow: a raw image -> a finished sprite pair.
#
# Pixelize -> crop to content -> center-align on canvas -> estimate normal ->
# assemble the diffuse+normal pair. Takes the source image as an EXTERNAL input
# (`$in.src`) so any task can feed it (generated, uploaded, or a video frame).
id: spritify
description: Clean a raw image into a pixel-art sprite pair (diffuse + normal).

inputs:
  src: image

params:
  width:    { type: int, default: 96 }
  height:   { type: int, default: 96 }
  grid_w:   { type: int, default: 64 }
  grid_h:   { type: int, default: 64 }
  colors:   { type: int, default: 32 }

nodes:
  - id: px
    tool: pixelize
    inputs: { image: $in.src }
    params:
      target_width: ${grid_w}
      target_height: ${grid_h}
      colors: ${colors}

  - id: crop
    tool: crop_to_content
    inputs: { image: px.image }
    params: { threshold: 128 }

  - id: align
    tool: center_align
    inputs: { image: crop.image }
    params:
      width: ${width}
      height: ${height}
      anchor: bottom_center

  - id: nrm
    tool: normal_estimate
    inputs: { image: align.image }
    params: { strength: 2.0 }

  - id: pair
    tool: make_sprite_pair
    inputs:
      diffuse: align.image
      normal: nrm.normal

output: pair.pair
