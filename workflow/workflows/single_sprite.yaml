# single_sprite — the v1 reference workflow.
#
# One prompt -> generate an image -> pixelize -> pixel-perfect + center-align
# on the canvas -> estimate a normal map -> assemble a sprite pair.
#
# This file doubles as a copy-and-adapt example for agents: add/remove nodes,
# rewire `inputs` (node.port), reference workflow params with ${name}.
id: single_sprite
capability: single_sprite
default: true
description: One prompt to a single pixel-art sprite pair (diffuse + normal).

params:
  prompt:   { type: string, default: "" }
  model_id: { type: string, default: "stub-image" }
  width:    { type: int,    default: 96 }
  height:   { type: int,    default: 96 }
  grid_w:   { type: int,    default: 64 }
  grid_h:   { type: int,    default: 64 }
  colors:   { type: int,    default: 32 }
  seed:     { type: int,    default: 0 }
  normal:   { type: bool,   default: true }

nodes:
  - id: gen
    component: text2img
    params:
      prompt: ${prompt}
      model_id: ${model_id}
      width: 512
      height: 512
      seed: ${seed}

  - id: px
    component: pixelize
    inputs: { image: gen.image }
    params:
      target_width: ${grid_w}
      target_height: ${grid_h}
      colors: ${colors}

  - id: crop
    component: crop_to_content
    inputs: { image: px.image }
    params: { threshold: 128 }

  - id: align
    component: center_align
    inputs: { image: crop.image }
    params:
      width: ${width}
      height: ${height}
      anchor: bottom_center

  - id: nrm
    component: normal_estimate
    inputs: { image: align.image }
    params: { strength: 2.0 }

  - id: pair
    component: make_sprite_pair
    inputs:
      diffuse: align.image
      normal: nrm.normal

output: pair.pair
