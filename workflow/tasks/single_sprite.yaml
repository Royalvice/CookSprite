# single_sprite — the v1 reference TASK: one prompt -> a finished sprite pair.
#
# A task is a DAG of workflow-nodes. This one composes two reusable workflows:
#   gen  (generate_image)  ->  spr  (spritify, fed gen's output as `src`)
# The simplest task shape; a sprite-animation-pack task would mount many more
# nodes (turntable, frame-extract, per-frame normal, pack ...).
#
# Each node may list `candidates:` (workflow ids, [0] the default) instead of a
# single `workflow:`; callers pick a non-default candidate per node at run time.
id: single_sprite
description: One prompt to a single pixel-art sprite pair (diffuse + normal).

params:
  prompt:   { type: string, default: "" }
  model_id: { type: string, default: "stub-image" }
  seed:     { type: int,    default: 0 }
  width:    { type: int,    default: 96 }
  height:   { type: int,    default: 96 }
  grid_w:   { type: int,    default: 64 }
  grid_h:   { type: int,    default: 64 }
  colors:   { type: int,    default: 32 }

nodes:
  - id: gen
    workflow: generate_image

  - id: spr
    workflow: spritify
    inputs: { src: gen }

output: spr
