[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cooksprite"
dynamic = ["version"]
description = "Cook up sprites with AI — a general, decoupled sprite-generation tool."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "CookSprite contributors" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "tomli>=2.0; python_version < '3.11'",
    "typing-extensions>=4.8",
    "websockets>=12",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.3", "Pillow>=10.0", "playwright>=1.55"]

[project.scripts]
cspr = "cli.__main__:main"

[tool.setuptools]
packages = ["cooksprite", "cooksprite.api", "cooksprite.comfy", "cooksprite.example_assets", "cooksprite.generated", "cooksprite.nodes", "cooksprite.tool_packages", "cli"]

[tool.setuptools.dynamic]
version = { attr = "cooksprite.version.__version__" }

[tool.setuptools.package-data]
cooksprite = ["actions.yaml", "example_assets/*.svg", "generated/*.json", "nodes/*.txt", "static/**/*", "skill/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
