[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cooksprite"
version = "0.1.0"
description = "Cook up sprites with AI — a general, decoupled sprite-generation tool."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "CookSprite contributors" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pillow>=10.2",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Heavy GPU serving deps — only needed on the inference host (e.g. H20).
serve = ["ray[serve]>=2.9"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.3"]

[project.scripts]
cspr = "cli.__main__:main"

[tool.setuptools]
packages = ["backend", "backend.adapters", "workflow", "workflow.tools", "workflow.export", "cli"]

[tool.setuptools.package-data]
workflow = ["workflows/*.yaml", "tasks/*.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
